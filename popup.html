<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Element Screenshot Saver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 240px;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #313244;
    }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #cba6f7;
      letter-spacing: 0.3px;
    }

    .header p {
      font-size: 11px;
      color: #6c7086;
      margin-top: 3px;
    }

    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #181825;
      border: 1px solid #313244;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6c7086;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .status-dot.active {
      background: #a6e3a1;
      box-shadow: 0 0 6px #a6e3a1aa;
    }

    #status-text {
      color: #6c7086;
      transition: color 0.2s;
    }

    #status-text.active {
      color: #a6e3a1;
    }

    #toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      background: #cba6f7;
      color: #1e1e2e;
    }

    #toggle-btn:hover {
      background: #b4befe;
    }

    #toggle-btn:active {
      transform: scale(0.97);
    }

    #toggle-btn.active {
      background: #f38ba8;
      color: #1e1e2e;
    }

    #toggle-btn.active:hover {
      background: #eba0ac;
    }

    .hint {
      font-size: 11px;
      color: #45475a;
      line-height: 1.5;
      padding: 8px 12px;
      background: #181825;
      border-radius: 8px;
      border: 1px solid #313244;
    }

    .hint strong {
      color: #585b70;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Element Screenshot Saver</h1>
    <p>Capture qualquer elemento da página</p>
  </div>

  <div class="content">
    <div class="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Modo de seleção inativo</span>
    </div>

    <button id="toggle-btn">Ativar seleção</button>

    <div class="hint">
      <strong>Como usar:</strong><br />
      Passe o mouse sobre um elemento para destacá-lo e clique para salvar como PNG.<br />
      Pressione <strong>Esc</strong> para desativar.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
